<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Hello World v1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian-black: #0B0F19;
            --neon-cyan: #00F2FF;
            --deep-purple-start: hsla(270, 50%, 40%, 0.25);
            --cyan-glow: hsla(183, 100%, 50%, 0.2);
            --grid-color: rgba(0, 242, 255, 0.07);
            --grid-size: 50px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--obsidian-black);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image:
                radial-gradient(at 15% 20%, var(--deep-purple-start) 0px, transparent 50%),
                radial-gradient(at 85% 80%, var(--cyan-glow) 0px, transparent 50%),
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, var(--grid-size) var(--grid-size), var(--grid-size) var(--grid-size);
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            from {
                background-position: 0 0, 0 0, 0 0, 0 0;
            }
            to {
                background-position: 0 0, 0 0, var(--grid-size) var(--grid-size), var(--grid-size) var(--grid-size);
            }
        }

        main {
            padding: 1rem;
        }

        .glass-card {
            position: relative;
            padding: 3rem 4rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            overflow: hidden; 
        }

        .pulse-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.25) 0%, rgba(0, 242, 255, 0) 65%);
            border-radius: 50%;
            z-index: 0;
            animation: pulse 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0.8;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }
        
        h1 {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            font-size: clamp(2.5rem, 8vw, 5rem);
            color: #ffffff;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5), 0 0 15px rgba(0, 242, 255, 0.4);
            letter-spacing: -0.02em;
        }

        @media (max-width: 768px) {
            .glass-card {
                padding: 2.5rem 1.5rem;
            }
            h1 {
                font-size: clamp(2rem, 12vw, 3.5rem);
            }
            .pulse-glow {
                width: 250px;
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="glass-card">
            <div class="pulse-glow"></div>
            <h1>Hello World</h1>
        </div>
    </main>
</body>
</html>
